# Generates Remanence.xcodeproj and Remanence/Info.plist.
# Run `xcodegen` after adding or removing targets or files.
name: Remanence
options:
  bundleIdPrefix: com.colton
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  RemanenceCore:
    path: RemanenceCore
targets:
  Remanence:
    type: application
    platform: macOS
    sources:
      - path: Remanence
        excludes:
          - Info.plist
    dependencies:
      - package: RemanenceCore
    info:
      path: Remanence/Info.plist
      properties:
        CFBundleDisplayName: Remanence
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: Remanence records tapes from your audio interface. macOS treats every audio input as a microphone. Audio stays on this Mac.
        # Lets audio and folders be dropped on the Dock icon. The Alternate rank
        # means Remanence never becomes the default app for opening audio.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Folder of Recordings
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colton.remanence
        PRODUCT_NAME: Remanence
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A stable signature, so macOS remembers the microphone permission between
        # builds. Personal app that runs local tools, so it stays out of the sandbox.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: Colton Harker (2ZMS5QPMP4)"
        DEVELOPMENT_TEAM: 4DX965488P
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
schemes:
  Remanence:
    build:
      targets:
        Remanence: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RemanenceCore/RemanenceCoreTests
